name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job names below are the required status checks of the `main` branch protection:
  # "Check" and "Obsidian (earliest and latest)". Rename them only together with that rule.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      # The scripts need no dependencies.
      - name: theme.css is built from the sources
        run: node scripts/build.mjs --check
      - name: Theme rules (manifest, no !important, no remote URLs)
        run: node scripts/check.mjs

  obsidian:
    name: Obsidian (earliest and latest)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    env:
      OBSIDIAN_VERSIONS: earliest/earliest latest/latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci

      # The Obsidian versions to test (minAppVersion and latest) decide the cache key.
      - name: Resolve Obsidian versions
        run: |
          npx tsx wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt || true
          rm -rf .obsidian-cache
        env:
          CI: 'true'
      - uses: actions/cache@v6
        with:
          path: .obsidian-cache
          key: obsidian-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}

      - name: Virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y herbstluftwm
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          DISPLAY=:99 herbstluftwm &
          sleep 1

      - name: Load the theme in a real Obsidian and take the screenshots
        run: npm run screenshots

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: test/screenshots/*.png
          retention-days: 14
